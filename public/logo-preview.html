<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cycling Coach — Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Figtree', sans-serif;
      background: #f0f0f0;
      color: #1c1c1e;
      padding: 48px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h2 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8e8e93;
      margin-bottom: 24px;
    }
    .section { margin-bottom: 52px; }
    .swatch {
      display: inline-flex;
      align-items: center;
      gap: 32px;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 32px 40px;
    }
    .swatch.dark  { background: #1c1c1e; border-color: #333; }
    .swatch.blue  { background: #2563EB; border-color: #1d4ed8; }
    .size-label   { font-size: 11px; color: #8e8e93; text-align: center; margin-top: 6px; }
    .size-col     { text-align: center; }
    .logo-full    { display: inline-flex; align-items: center; gap: 12px; }
    .wordmark     { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; color: #1c1c1e; line-height: 1; }
    .wordmark-sm  { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #1c1c1e; line-height: 1; }
    .wordmark.white, .wordmark-sm.white { color: white; }
    .nav-sim {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 56px;
      max-width: 680px;
    }
    .nav-brand-sim { display: flex; align-items: center; gap: 10px; margin-right: 32px; }
    .nav-link-sim {
      font-size: 14px; font-weight: 500; color: #8e8e93;
      padding: 0 14px; height: 56px; display: flex; align-items: center;
      border-bottom: 2px solid transparent;
    }
    .nav-link-sim.active { color: #1c1c1e; border-bottom-color: #2563EB; font-weight: 600; }
  </style>
</head>
<body>

<!-- Reusable road-bike SVG as a symbol -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="bike">
      <circle cx="6.5" cy="20" r="5.5" stroke="white" stroke-width="1.5" fill="none"/>
      <circle cx="6.5" cy="20" r="1.1" fill="white"/>
      <circle cx="22" cy="20" r="5.5" stroke="white" stroke-width="1.5" fill="none"/>
      <circle cx="22" cy="20" r="1.1" fill="white"/>
      <line x1="6.5" y1="20" x2="14.5" y2="20" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="14.5" y1="20" x2="12" y2="11.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="12" y1="11.5" x2="6.5" y2="20" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="12" y1="11.5" x2="12" y2="10" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="10.5" y1="10" x2="13.5" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="11.5" x2="20.5" y2="13" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="20.5" y1="13" x2="21.5" y2="15.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <line x1="21.5" y1="15.5" x2="14.5" y2="20" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="21.5" y1="15.5" x2="22" y2="20" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="20.5" y1="13" x2="21" y2="11" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="19" y1="11" x2="23" y2="11" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M23 11 Q23.5 11.3 23.5 13" stroke="white" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<!-- MARK SIZES -->
<div class="section">
  <h2>Logo mark — sizes</h2>
  <div class="swatch">
    <div class="size-col">
      <svg width="16" height="16" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#2563EB"/><use href="#bike"/></svg>
      <div class="size-label">16px</div>
    </div>
    <div class="size-col">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#2563EB"/><use href="#bike"/></svg>
      <div class="size-label">28px</div>
    </div>
    <div class="size-col">
      <svg width="48" height="48" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#2563EB"/><use href="#bike"/></svg>
      <div class="size-label">48px</div>
    </div>
    <div class="size-col">
      <svg width="96" height="96" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#2563EB"/><use href="#bike"/></svg>
      <div class="size-label">96px</div>
    </div>
    <div class="size-col">
      <svg width="160" height="160" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#2563EB"/><use href="#bike"/></svg>
      <div class="size-label">160px</div>
    </div>
  </div>
</div>

<!-- FULL LOGO — LIGHT -->
<div class="section">
  <h2>Full logo — light background</h2>
  <div class="swatch">
    <div class="logo-full">
      <svg width="44" height="44" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#2563EB"/><use href="#bike"/></svg>
      <div>
        <div style="font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#2563EB;margin-bottom:3px">My</div>
        <div class="wordmark">Cycling Coach</div>
      </div>
    </div>
  </div>
</div>

<!-- FULL LOGO — DARK -->
<div class="section">
  <h2>Full logo — dark background</h2>
  <div class="swatch dark">
    <div class="logo-full">
      <svg width="44" height="44" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#2563EB"/><use href="#bike"/></svg>
      <div>
        <div style="font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#93c5fd;margin-bottom:3px">My</div>
        <div class="wordmark white">Cycling Coach</div>
      </div>
    </div>
  </div>
</div>

<!-- NAV CONTEXT -->
<div class="section">
  <h2>In the nav bar</h2>
  <div class="nav-sim">
    <div class="nav-brand-sim">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#2563EB"/><use href="#bike"/></svg>
      <span class="wordmark-sm">My Cycling Coach</span>
    </div>
    <a class="nav-link-sim active">Dashboard</a>
    <a class="nav-link-sim">Calendar</a>
    <a class="nav-link-sim">Fitness</a>
    <a class="nav-link-sim">Settings</a>
  </div>
</div>

</body>
</html>
